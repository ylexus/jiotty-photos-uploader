import org.apache.tools.ant.filters.ReplaceTokens
import org.gradle.internal.os.OperatingSystem

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.runtime' version '2.0.1'
}

version = readEnvOrDefault 'VERSION', '0.DEV'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        // Liberica "Full" bundles JavaFX as modules, which jlink puts into the packaged runtime (see checkToolchainHasJavaFx)
        vendor = JvmVendorSpec.BELLSOFT
    }
}

ext {
    javafxVersion = '25.0.5'
}

// macOS signing: MAC_SIGNING_IDENTITY is a codesign identity, e.g. "Developer ID Application: <name> (<team ID>)"; without it the app is
// built unsigned, fine for local testing. MAC_NOTARY_PROFILE names the notarytool keychain profile used by notarizeDmg.
String macSigningIdentity = readEnvOrNull('MAC_SIGNING_IDENTITY')
String macNotaryProfile = readEnvOrNull('MAC_NOTARY_PROFILE')
// optional: a keychain other than the default search list that holds the signing identity (e.g. a temporary one on CI)
String macSigningKeychain = readEnvOrNull('MAC_SIGNING_KEYCHAIN')
File macEntitlements = file('src/main/packaging-resources/macOS/entitlements.plist')

repositories {
    mavenCentral()
    maven {
        url = "https://maven.google.com"
    }
    maven {
        // mdfx is not published to Maven Central
        url = "https://sandec.jfrog.io/artifactory/repo"
        content {
            includeGroup "com.sandec"
        }
    }
}

configurations {
    // The H2 version that wrote upload state databases before 2.1.0; bundled as a resource and loaded in an isolated class loader only to migrate
    // such a database to the current H2 file format (see LegacyH2Database).
    legacyH2 {
        transitive = false
    }
    // Mockito's inline mock maker needs its agent attached at JVM start, as dynamic agent loading is going away (JEP 451).
    mockitoAgent {
        transitive = false
    }
}

dependencies {
    def jiottyVersion = '3.8.0'
    def jiottyBom = platform("net.yudichev.jiotty:jiotty-bom:$jiottyVersion")

    implementation jiottyBom
    annotationProcessor jiottyBom
    testAnnotationProcessor jiottyBom
    testImplementation platform('org.junit:junit-bom:6.1.3')

    annotationProcessor "org.immutables:value"
    testAnnotationProcessor "org.immutables:value"
    compileOnly "org.immutables:value"
    testCompileOnly "org.immutables:value"

    implementation 'net.yudichev.jiotty:jiotty-common'
    implementation('net.yudichev.jiotty:jiotty-connector-google-photos') {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation('net.yudichev.jiotty:jiotty-connector-google-drive') {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation 'net.yudichev.jiotty:jiotty-persistence-varstore'
    implementation "org.apache.logging.log4j:log4j-api"
    implementation "com.google.inject:guice"
    implementation "jakarta.inject:jakarta.inject-api"
    implementation "com.google.guava:guava"
    implementation "com.google.code.findbugs:jsr305"
    implementation "com.google.errorprone:error_prone_annotations"
    implementation "com.fasterxml.jackson.core:jackson-annotations"
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.google.api:gax"
    implementation "io.grpc:grpc-api"
    implementation "commons-cli:commons-cli:1.11.0"
    implementation "de.jangassen:nsmenufx:3.1.0"
    implementation "com.sandec:mdfx:0.2.12"
    implementation 'com.h2database:h2:2.5.252'

    // only used to read upload state databases written by app versions up to 2.1.0, then migrate them
    //noinspection VulnerableLibrariesLocal
    legacyH2 'com.h2database:h2:1.4.200'

    runtimeOnly "org.apache.logging.log4j:log4j-core"
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl"
    runtimeOnly "org.apache.logging.log4j:log4j-jcl"
    runtimeOnly "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"

    testImplementation "net.yudichev.jiotty:jiotty-connector-google-drive::tests"
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-junit-jupiter:5.24.0"
    testImplementation "org.hamcrest:hamcrest:3.0"
    mockitoAgent "org.mockito:mockito-core:5.24.0"
}

tasks.named('processResources', ProcessResources) {
    from(configurations.legacyH2) {
        into 'net/yudichev/googlephotosupload/core'
        rename { 'legacy-h2.jar' }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty "user.language", "en"
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}

String clientSecretPath = readEnvOrNull('CLIENT_SECRET_PATH')
tasks.named('processResources', ProcessResources) {
    if (clientSecretPath) {
        from(clientSecretPath) {
            rename { 'client_secret.json' }
        }
    }
}

tasks.register('requireClientSecret') {
    doLast {
        if (!clientSecretPath) {
            throw new InvalidUserDataException("CLIENT_SECRET_PATH system property or environment variable missing - " +
                    "should exist and contain a path to Google OAuth client secret file")
        }
        if (!file(clientSecretPath).exists()) {
            throw new InvalidUserDataException("Client secret file not found: $clientSecretPath")
        }
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Jiotty Photos Uploader',
                'Implementation-Version': archiveVersion
    }
}

application {
    mainClass = 'net.yudichev.googlephotosupload.Main'
    applicationName = 'Jiotty Photos Uploader'
    applicationDefaultJvmArgs = [
            // HypnosResizePolicy calls TableColumnBase.doSetWidth
            '--add-opens', 'javafx.controls/javafx.scene.control=ALL-UNNAMED',
            // JavaFX and JNA (used by NSMenuFX) load native libraries; without this Java 25 warns, and later versions will refuse
            '--enable-native-access=javafx.graphics,javafx.media,javafx.web,ALL-UNNAMED']
}

javafx {
    version = "$javafxVersion"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web']
}

runtime {
    //noinspection GroovyAssignabilityCheck, GroovyAccessibility, GrFinalVariableAccess
    options = ['--strip-debug',
               '--compress', '2',
               '--no-header-files',
               '--no-man-pages']

    // required by httpclient, missed by default when building and running on Windows
    //noinspection GroovyAssignabilityCheck,GroovyAccessibility,GrFinalVariableAccess
    modules = [
            // required by httpclient, missed by default when building and running on Windows
            'java.naming',
            // the Google OAuth login callback server (LocalServerReceiver) is built on the JDK's HTTP server
            'jdk.httpserver',
            // required for a heap dump via JMX
            'jdk.management'
    ]
    //noinspection GroovyAssignabilityCheck,GroovyAccessibility,GrFinalVariableAccess
    additive = true

    jpackage {
        imageName = 'Jiotty Photos Uploader'
        installerName = 'Jiotty Photos Uploader'
        jvmArgs = application.applicationDefaultJvmArgs + ['-Dprism.verbose=true', '-Djavafx.verbose=true']
        if (OperatingSystem.current().macOsX) {
            installerType = 'dmg'
            imageOptions = ['--verbose',
                            '--mac-package-identifier', 'net.yudichev.googlephotosupload.ui',
                            '--mac-app-category', 'photography',
                            '--copyright', 'Copyright (C) 2020-2026 Alexey Yudichev']
            if (macSigningIdentity) {
                imageOptions += ['--mac-sign',
                                 '--mac-app-image-sign-identity', macSigningIdentity,
                                 '--mac-entitlements', macEntitlements.absolutePath]
                if (macSigningKeychain) {
                    imageOptions += ['--mac-signing-keychain', macSigningKeychain]
                }
            }
            installerOptions = ['--verbose']
            // icons only: jpackage generates Info.plist from the options above
            resourceDir = file("$projectDir/src/main/packaging-resources/macOS/out")
        }
        if (OperatingSystem.current().windows) {
            installerType = 'msi'
            imageOptions = ['--verbose']
            installerOptions = ['--verbose', '--win-per-user-install', '--win-menu', '--win-upgrade-uuid', '58e3cc92-0df9-4089-9609-8ad54b2608e7']
            resourceDir = file("$projectDir/src/main/packaging-resources/windows")
        }
        if (OperatingSystem.current().linux) {
            if (project.hasProperty("raspberryPi")) {
                // do not try to build rpm on RPi
                installerType = 'deb'
            }
            imageName = 'JiottyPhotosUploader'  // cannot have spaces in Debian resource names
            installerName = 'JiottyPhotosUploader' // cannot have spaces in Debian resource names
            imageOptions = ['--verbose']
            resourceDir = file("$projectDir/src/main/packaging-resources/linux")
            //noinspection GroovyResultOfAssignmentUsed the closure's result is not used
            installerOptions = ['--verbose', '--linux-shortcut', '--linux-package-name', 'jiotty-photos-uploader']
        }
    }
}
tasks.named('jpackage') {
    dependsOn 'check', 'requireClientSecret'
}

// The packaged app takes JavaFX from the runtime image, whose native libraries are then plain files (simple to sign), so the JavaFX jars, which only
// `run` and the tests need, are left out of the package. That only works if the JDK that jlink uses has the JavaFX modules.
tasks.register('checkToolchainHasJavaFx') {
    def toolchainHome = javaToolchains.launcherFor(java.toolchain).map { it.metadata.installationPath.asFile }
    doLast {
        def javaFxJmod = new File(toolchainHome.get(), 'jmods/javafx.graphics.jmod')
        if (!javaFxJmod.exists()) {
            throw new GradleException("The Java toolchain at ${toolchainHome.get()} has no JavaFX modules ($javaFxJmod is missing); " +
                    "packaging needs a JDK that bundles JavaFX, e.g. Liberica Full")
        }
    }
}
tasks.named('jre') { dependsOn 'checkToolchainHasJavaFx' }
tasks.named('installDist', Sync) {
    exclude 'javafx-*.jar'
}

tasks.register('ensureVersionReleaseReady') {
    def releaseVersion = version
    doLast {
        if (!(releaseVersion ==~ /\d+\.\d+\.\d+/)) {
            throw new InvalidUserDataException("version must be set to X.Y.Z format but was: ${releaseVersion}; " +
                    "add -DVERSION=X.Y.Z to the command line and try again")
        }
    }
}

// --- macOS: sign (when MAC_SIGNING_IDENTITY is set), then notarize the DMG (fullpackage only, needs MAC_NOTARY_PROFILE) ---

tasks.register('signJarNativeLibraries', Exec) {
    description = 'Signs the macOS native libraries inside the jars that go into the app bundle, which jpackage does not reach'
    onlyIf { OperatingSystem.current().macOsX && macSigningIdentity }
    dependsOn 'installDist'
    def libDir = tasks.named('installDist', Sync).map { new File(it.destinationDir, 'lib') }
    commandLine 'bash', file('src/main/packaging-resources/macOS/sign-jar-natives.sh').absolutePath
    argumentProviders.add({ [libDir.get().absolutePath, macSigningIdentity ?: '', macEntitlements.absolutePath] } as CommandLineArgumentProvider)
    environment 'MAC_SIGNING_KEYCHAIN', macSigningKeychain ?: ''
}
tasks.named('jpackageImage') { dependsOn 'signJarNativeLibraries' }

def macArch = System.getProperty('os.arch') == 'aarch64' ? 'arm64' : 'x64'
def macDmgFileName = "macOS-${macArch}-jiotty-photos-uploader-${version}.dmg"

tasks.register('notarizeDmg', Exec) {
    description = 'Signs and notarizes the DMG, and staples the notarization ticket to it'
    onlyIf { OperatingSystem.current().macOsX }
    dependsOn 'jpackage'
    doFirst {
        if (!macSigningIdentity || !macNotaryProfile) {
            throw new InvalidUserDataException('A release DMG must be signed and notarized: set MAC_SIGNING_IDENTITY (e.g. ' +
                    '"Developer ID Application: <name> (<team ID>)") and MAC_NOTARY_PROFILE (a notarytool keychain profile name)')
        }
    }
    def dmgFile = layout.buildDirectory.file("jpackage/${application.applicationName}-${version}.dmg")
    commandLine 'bash', file('src/main/packaging-resources/macOS/notarize-dmg.sh').absolutePath
    argumentProviders.add({ [dmgFile.get().asFile.absolutePath, macSigningIdentity ?: '', macNotaryProfile ?: ''] } as CommandLineArgumentProvider)
}

// --- Windows: MSI from jpackage; MSIX, for the Microsoft Store, from the same app image ---

def msiFileName = "Windows-jiotty-photos-uploader-${version}.msi"
def msixFileName = "Windows-jiotty-photos-uploader-${version}.msix"

tasks.register('stageMsix', Sync) {
    description = 'Lays out the app image with the MSIX manifest and logos, ready for makeappx'
    dependsOn 'jpackageImage'
    // the MSI task (jpackage) writes to the same directory as the app image
    mustRunAfter 'jpackage'
    from(layout.buildDirectory.dir("jpackage/${application.applicationName}"))
    from("$projectDir/src/main/packaging-resources/windows/msix") {
        exclude 'AppxManifest.xml'
    }
    from("$projectDir/src/main/packaging-resources/windows/msix") {
        include 'AppxManifest.xml'
        filter(ReplaceTokens, tokens: [
                version             : version.toString(),
                // placeholders for local builds; the Store build passes the values from Partner Center's Product identity page
                identityName        : readEnvOrDefault('MSIX_IDENTITY_NAME', 'JiottyPhotosUploader.Dev'),
                publisher           : readEnvOrDefault('MSIX_PUBLISHER', 'CN=Alexey Yudichev'),
                publisherDisplayName: readEnvOrDefault('MSIX_PUBLISHER_DISPLAY_NAME', 'Alexey Yudichev')])
    }
    into layout.buildDirectory.dir('msix')
}

tasks.register('packageMsix', Exec) {
    description = 'Packs the MSIX with makeappx from the Windows SDK; the package is unsigned, as the Microsoft Store signs it'
    onlyIf { OperatingSystem.current().windows }
    dependsOn 'stageMsix'
    def stagingDir = layout.buildDirectory.dir('msix')
    def msixFile = layout.buildDirectory.file("fullpackage/$msixFileName")
    outputs.file msixFile
    doFirst {
        msixFile.get().asFile.parentFile.mkdirs()
        it.executable findMakeAppx()
    }
    args 'pack', '/o', '/d', stagingDir.get().asFile.absolutePath, '/p', msixFile.get().asFile.absolutePath
}

static String findMakeAppx() {
    def kitsBin = new File(System.getenv('ProgramFiles(x86)') ?: 'C:\\Program Files (x86)', 'Windows Kits\\10\\bin')
    def candidates = (kitsBin.listFiles() ?: [] as File[])
            .findAll { it.name ==~ /10\.[\d.]+/ }
            .sort { left, right -> compareVersions(right.name, left.name) }
            .collect { new File(it, 'x64\\makeappx.exe') }
            .findAll { it.exists() }
    if (candidates.isEmpty()) {
        throw new GradleException("makeappx.exe not found under $kitsBin; install the Windows SDK")
    }
    candidates.first().absolutePath
}

static int compareVersions(String left, String right) {
    def leftParts = left.tokenize('.')*.toInteger()
    def rightParts = right.tokenize('.')*.toInteger()
    for (int index = 0; index < Math.min(leftParts.size(), rightParts.size()); index++) {
        if (leftParts[index] != rightParts[index]) {
            return leftParts[index] <=> rightParts[index]
        }
    }
    leftParts.size() <=> rightParts.size()
}

/**
 * Packages the app for release on the current platform into build/fullpackage: on macOS a signed and notarized DMG, on Windows an MSI and an MSIX
 * (on Linux, not currently released, a deb and an rpm).
 */
tasks.register('fullpackage') {
    dependsOn 'ensureVersionReleaseReady'
    def outputDir = layout.buildDirectory.dir('fullpackage')
    def jpackageDir = layout.buildDirectory.dir('jpackage')
    def appName = application.applicationName
    def releaseVersion = version
    if (OperatingSystem.current().macOsX) {
        dependsOn 'notarizeDmg'
        doLast {
            project.copy {
                from jpackageDir.get().file("$appName-${releaseVersion}.dmg")
                into outputDir
                rename { macDmgFileName }
            }
        }
    } else if (OperatingSystem.current().windows) {
        dependsOn 'jpackage', 'packageMsix'
        doLast {
            project.copy {
                from jpackageDir.get().file("$appName-${releaseVersion}.msi")
                into outputDir
                rename { msiFileName }
            }
        }
    } else {
        // not currently released, kept buildable
        dependsOn 'jpackage'
        doLast {
            project.copy {
                from jpackageDir.get().asFile
                include '*.deb', '*.rpm'
                into outputDir
                rename { "Linux-$it" }
            }
        }
    }
}
tasks.named('jpackage') { mustRunAfter 'ensureVersionReleaseReady' }

private static readEnvOrNull(String variableName) {
    System.getProperty(variableName, System.getenv(variableName))
}

private static readEnvOrDefault(String variableName, String defaultValue) {
    readEnvOrNull(variableName) ?: defaultValue
}