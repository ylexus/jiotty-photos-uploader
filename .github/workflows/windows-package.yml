name: Windows package

# Builds the Windows MSI (for GitHub releases) and MSIX (for the Microsoft Store) and keeps them as workflow artifacts; publishing stays manual.
#
# Needs the repository secret GOOGLE_CLIENT_SECRET_JSON (the Google OAuth client secret JSON). For a Store submission, set the repository
# variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME to the values on Partner Center's Product identity page.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, X.Y.Z
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: liberica
          java-package: jdk+fx
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install WiX
        # jpackage builds the MSI with WiX; v5 is the newest version it supports
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Write Google client secret
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: |
          if [[ -z "${GOOGLE_CLIENT_SECRET_JSON}" ]]; then
            echo "::error::Repository secret GOOGLE_CLIENT_SECRET_JSON is not set"
            exit 1
          fi
          printf '%s' "${GOOGLE_CLIENT_SECRET_JSON}" > "${RUNNER_TEMP}/client_secret.json"
          echo "CLIENT_SECRET_PATH=${RUNNER_TEMP}/client_secret.json" >> "${GITHUB_ENV}"
      - name: Package
        run: ./gradlew fullpackage
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages-${{ inputs.version }}
          path: app/build/fullpackage/*
          if-no-files-found: error
